[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "striker"
version = "0.1.0"
description = "Self-hosted retrospective OSINT archive and evidence system for documenting strikes."
requires-python = ">=3.11"
dependencies = [
  "alembic>=1.13",
  "bcrypt>=4.1",
  "fastapi>=0.111",
  "geopy>=2.4",
  "httpx>=0.27",
  "jinja2>=3.1",
  "pandas>=2.2",
  "playwright>=1.44",
  "python-docx>=1.1",
  "python-multipart>=0.0.9",
  "pyyaml>=6.0",
  "rapidfuzz>=3.9",
  "sqlalchemy>=2.0",
  "telethon>=1.36",
  "uvicorn[standard]>=0.30",
]

[project.optional-dependencies]
test = ["pytest>=8.2", "pytest-asyncio>=0.23"]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

