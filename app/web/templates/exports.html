{% extends "base.html" %}
{% block content %}
<h1>Exports</h1>
<form method="post" action="/exports/build-latest"><input type="hidden" name="csrf_token" value="{{ csrf_token }}"><button>Build latest</button></form>
<table><tr><th>ID</th><th>Created</th><th>Title</th><th>Download</th></tr>
{% for e in exports %}<tr><td>{{ e.id }}</td><td>{{ e.created_at }}</td><td>{{ e.title or '' }}</td><td><a href="/exports/{{ e.id }}/download?file=docx">report.docx</a> | <a href="/exports/{{ e.id }}/download?file=html">report.html</a> | <a href="/exports/{{ e.id }}/download?file=zip">evidence.zip</a></td></tr>{% endfor %}
</table>
{% endblock %}
