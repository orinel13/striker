{% extends "base.html" %}
{% block content %}
<h1>Messages</h1>
<table><tr><th>Date</th><th>Channel</th><th>Score</th><th>Text</th><th>URL</th></tr>
{% for m in messages %}<tr><td>{{ m.posted_at }}</td><td>{{ m.channel_id }}</td><td>{{ m.relevance_score }}</td><td>{{ m.text[:500] }}</td><td>{% if m.url %}<a href="{{ m.url }}">link</a>{% endif %}</td></tr>{% endfor %}
</table>
{% endblock %}
